version: "3.8"

services:
  localstack:
    image: localstack/localstack:3.0
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs,dynamodb
      - DEFAULT_REGION=us-east-1
    volumes:
      - "./init-localstack.sh:/etc/localstack/init/ready.d/init-localstack.sh"
      - "localstack_data:/var/lib/localstack"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:4566/_localstack/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  processor-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - AWS_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://localstack:4566
      - NOTIFICATION_THRESHOLD=5
      - DYNAMODB_TABLE_NAME=UserActivityAggregates
      - PROCESSED_EVENTS_TABLE_NAME=ProcessedEvents
      - INPUT_QUEUE_URL=http://localstack:4566/000000000000/user-activity-input-queue
      - OUTPUT_QUEUE_URL=http://localstack:4566/000000000000/user-activity-output-queue
      - DLQ_URL=http://localstack:4566/000000000000/user-activity-dlq
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - LOG_LEVEL=INFO
      - POLL_INTERVAL_SECONDS=2
      - HEALTH_CHECK_PORT=8000
    depends_on:
      localstack:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  localstack_data:
